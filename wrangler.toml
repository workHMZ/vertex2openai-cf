#:schema node_modules/wrangler/config-schema.json
name = "vertex2openai"
main = "src/index.ts"
compatibility_date = "2026-09-03"
# No Node.js APIs are used — the Worker runs on Web APIs only.
# compatibility_flags = ["nodejs_compat"]

[vars]
GCP_LOCATION = "global"

# Optional: pin the GCP project when the Service Account key names a different one.
# GCP_PROJECT_ID = "your-project-id"

# Secrets (set via `wrangler secret put`):
# API_KEY                  - Required. API key that protects this adapter.
# GOOGLE_CREDENTIALS_JSON  - Service Account JSON key(s), comma-separated.
# VERTEX_EXPRESS_API_KEY   - Vertex AI Express API key(s), comma-separated.
# VERTEX_API_KEY           - Alias for VERTEX_EXPRESS_API_KEY.
# One of GOOGLE_CREDENTIALS_JSON / VERTEX_EXPRESS_API_KEY is required.

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
